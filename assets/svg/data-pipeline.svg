<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title">
<title id="title">LabVIEW data arrives over MQTT, and Sol-Ark, eGauge, and Daikin data come through vendor APIs, all into InfluxDB</title>
<style>
.bg { fill: #f7f4f0; }
.box { fill: #ffffff; stroke: #cfc9c0; stroke-width: 3; }
.flow { fill: none; stroke: #8a8f95; stroke-width: 3; }
.head { fill: #8a8f95; }
.hub { fill: #f3e3e5; stroke: #7a1f2b; stroke-width: 3.5; }
.db { fill: #e4ebf7; stroke: #1f4fa3; stroke-width: 3.5; }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.label { fill: #1d1d1f; font-size: 34px; font-weight: 600; }
.hubtext { fill: #7a1f2b; font-size: 24px; font-weight: 700; }
.dbtext { fill: #1d1d1f; font-size: 30px; font-weight: 700; }
.sub { fill: #5f6368; font-size: 27px; font-weight: 600; }
.d1 { fill: #7a1f2b; } .d2 { fill: #1f4fa3; } .d3 { fill: #2e7d5b; } .d4 { fill: #b26a00; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1f2124; }
  .box { fill: #26292d; stroke: #3a3e43; }
  .flow { stroke: #7d838a; }
  .head { fill: #7d838a; }
  .hub { fill: #3a2529; stroke: #e3929c; }
  .db { fill: #1e2a40; stroke: #8fb4ff; }
  .label, .dbtext { fill: #e8e6e3; }
  .hubtext { fill: #e3929c; }
  .sub { fill: #a1a5ab; }
  .d1 { fill: #e3929c; } .d2 { fill: #8fb4ff; } .d3 { fill: #7fd1a8; } .d4 { fill: #f0b45c; }
}
</style>
