<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title">
<title id="title">Four people talking with one AI agent that sets a shared thermostat</title>
<style>
.bg { fill: #f7f4f0; }
.dial { fill: #ffffff; stroke: #3c4043; stroke-width: 4; }
.ring { fill: none; stroke: #cfc9c0; stroke-width: 2; }
.link { fill: none; stroke: #8a8f95; stroke-width: 3; stroke-dasharray: 8 8; }
.ctl { fill: none; stroke: #7a1f2b; stroke-width: 4; }
.head { fill: #7a1f2b; }
.bubble { fill: #ffffff; stroke: #3c4043; stroke-width: 3; stroke-linejoin: round; }
.dots { fill: #3c4043; }
.hub { fill: #f3e3e5; stroke: #7a1f2b; stroke-width: 4; }
.spark { fill: #7a1f2b; }
.person { stroke: #3c4043; stroke-width: 3; }
.p1 { fill: #dbe6f5; } .p2 { fill: #e5edf0; } .p3 { fill: #f4e8da; } .p4 { fill: #f6dcd5; }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; }
.temp { fill: #1d1d1f; font-size: 32px; }
.label { fill: #7a1f2b; font-size: 28px; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1f2124; }
  .dial, .bubble { fill: #26292d; stroke: #c9cdd2; }
  .ring { stroke: #3a3e43; }
  .link { stroke: #7d838a; }
  .ctl { stroke: #e3929c; }
  .head, .spark { fill: #e3929c; }
  .dots { fill: #c9cdd2; }
  .hub { fill: #3a2529; stroke: #e3929c; }
  .person { stroke: #c9cdd2; }
  .p1 { fill: #24324a; } .p2 { fill: #2b3438; } .p3 { fill: #3d3326; } .p4 { fill: #45302b; }
  .temp { fill: #e8e6e3; }
  .label { fill: #e3929c; }
}
</style>
